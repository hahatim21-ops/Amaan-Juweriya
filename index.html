</head>
<body>

  <!-- Blurred copy of the page you're on, filling the sides on wide screens -->
  <div class="backdrop" aria-hidden="true">
    <div class="on" style="background-image:url('assets/web/v2-blur.jpg')"></div>
    <div style="background-image:url('assets/web/v3-blur.jpg')"></div>
    <div style="background-image:url('assets/web/v4-blur.jpg')"></div>
    <div style="background-image:url('assets/web/v5-blur.jpg')"></div>
    <div style="background-image:url('assets/web/v6-blur.jpg')"></div>
  </div>

  <!-- ============ PAGE 1 · TAP TO OPEN ============ -->
  <div id="door" role="button" tabindex="0" aria-label="Tap to open the invitation">
    <div class="door-bg" aria-hidden="true"></div>
    <div class="door-stage">
      <div class="door-zoom">
        <!-- sized to the cover-fitted artwork by JS; children use % of the artwork -->
        <div class="door-scene">
          <div class="leaf leaf-l"><img src="assets/web/door-leaf-l.webp" alt="" draggable="false" /><span class="leaf-shade"></span></div>
          <div class="leaf leaf-r"><img src="assets/web/door-leaf-r.webp" alt="" draggable="false" /><span class="leaf-shade"></span></div>
          <img class="door-frame" src="assets/web/door-frame.webp" alt="Ornate cream and gold double doors" draggable="false" />
          <span class="chandelier-glow" aria-hidden="true"></span>
          <img class="chandelier" src="assets/web/door-chandelier.webp" alt="" draggable="false" />
        </div>
      </div>
      <canvas class="door-sparkles" aria-hidden="true"></canvas>
      <div class="door-cta" aria-hidden="true">
        <span class="door-ring"></span>
        <span class="door-ring door-ring--2"></span>
        <span class="door-label"><span class="door-label-text">Tap to Open</span></span>
      </div>
    </div>
  </div>
  <div id="flash" aria-hidden="true"></div>

  <!-- ============ THE FILM: one continuous column of 9:16 pages ============ -->
  <main id="film" aria-label="Wedding invitation">
    <div class="col">

      <!-- v2 · Invitation -->
      <section class="scene" data-scene="0" aria-label="Invitation: Amaan and Juwairiyah">
        <div class="stage">
          <video class="vid" muted playsinline webkit-playsinline loop preload="auto" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1"
                 poster="assets/web/v2-plate.jpg" src="assets/web/v2-plate.mp4"></video>
          <img class="tl" src="assets/web/text/tx2-1.webp" alt="" aria-hidden="true" style="left:37.778%;top:12.396%;width:30.093%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-2.webp" alt="" aria-hidden="true" style="left:25.37%;top:15.365%;width:55.556%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-3.webp" alt="" aria-hidden="true" style="left:25.741%;top:21.042%;width:54.444%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-4.webp" alt="" aria-hidden="true" style="left:27.037%;top:24.948%;width:47.593%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-5.webp" alt="" aria-hidden="true" style="left:27.407%;top:26.979%;width:46.667%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-6.webp" alt="" aria-hidden="true" style="left:22.87%;top:31.354%;width:55.0%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-7.webp" alt="" aria-hidden="true" style="left:20.185%;top:41.979%;width:60.741%" draggable="false" />
          <img class="tl" src="assets/web/text/tx2-8.webp" alt="" aria-hidden="true" style="left:23.889%;top:55.052%;width:55.833%" draggable="false" />
          <div class="scroll-hint" aria-hidden="true">
            <span>Scroll</span>
            <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" /></svg>
          </div>
        </div>
      </section>

      <!-- v3 · Date reveal + countdown -->
      <section class="scene" data-scene="1" aria-label="Save the date">
        <div class="stage">
          <video class="vid" muted playsinline webkit-playsinline loop preload="metadata" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1"
                 poster="assets/web/v3-plate.jpg" data-src="assets/web/v3-plate.mp4"></video>
          <img class="tl" data-scratch-line src="assets/web/text/tx3-1.webp" alt="" aria-hidden="true" style="left:7.778%;top:12.865%;width:85.556%" draggable="false" />
          <img class="tl" src="assets/web/text/tx3-2.webp" alt="" aria-hidden="true" style="left:38.704%;top:18.333%;width:22.222%" draggable="false" />

          <div class="date-glow" aria-hidden="true"></div>
          <!-- velvet ribbon over the date: scratch it away -->
          <div class="scratch">
            <canvas class="scratch-canvas" role="button" tabindex="0" aria-label="Scratch to reveal the date"></canvas>
            <span class="scratch-hint" aria-hidden="true"><i></i></span>
          </div>
          <div class="foil-burst" aria-hidden="true"></div>

          <div class="countdown" aria-live="polite">
            <div class="cd-boxes">
              <div class="cd-box"><div class="cd-num" data-unit="d"><span>00</span></div><div class="cd-lbl">Days</div></div>
              <div class="cd-box"><div class="cd-num" data-unit="h"><span>00</span></div><div class="cd-lbl">Hours</div></div>
              <div class="cd-box"><div class="cd-num" data-unit="m"><span>00</span></div><div class="cd-lbl">Minutes</div></div>
              <div class="cd-box"><div class="cd-num" data-unit="s"><span>00</span></div><div class="cd-lbl">Seconds</div></div>
            </div>
            <p class="cd-done">Alhamdulillah — the day is here</p>
          </div>
        </div>
      </section>

      <!-- v4 · Nikah -->
      <section class="scene" data-scene="2" aria-label="Nikah details">
        <div class="stage">
          <video class="vid" muted playsinline webkit-playsinline loop preload="metadata" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1"
                 poster="assets/web/v4-plate.jpg" data-src="assets/web/v4-plate.mp4"></video>
          <img class="tl" src="assets/web/text/tx4-1.webp" alt="" aria-hidden="true" style="left:14.815%;top:12.24%;width:36.852%" draggable="false" />
          <img class="tl" src="assets/web/text/tx4-2.webp" alt="" aria-hidden="true" style="left:7.87%;top:20.052%;width:63.241%" draggable="false" />
          <img class="tl" src="assets/web/text/tx4-3.webp" alt="" aria-hidden="true" style="left:11.574%;top:25.208%;width:44.259%" draggable="false" />
          <img class="tl" src="assets/web/text/tx4-4.webp" alt="" aria-hidden="true" style="left:15.185%;top:29.583%;width:44.074%" draggable="false" />
          <img class="tl" src="assets/web/text/tx4-5.webp" alt="" aria-hidden="true" style="left:3.333%;top:32.5%;width:68.519%" draggable="false" />
          <img class="tl" src="assets/web/text/tx4-6.webp" alt="" aria-hidden="true" style="left:29.352%;top:35.469%;width:16.389%" draggable="false" />
          <img class="tl" src="assets/web/text/tx4-7.webp" alt="" aria-hidden="true" style="left:70.556%;top:38.177%;width:2.963%" draggable="false" />
          <a class="map-btn" data-map="nikah" target="_blank" rel="noopener">
            <span class="map-ico" aria-hidden="true">📍</span> Tap for Location
          </a>
        </div>
      </section>

      <!-- v5 · Walima -->
      <section class="scene" data-scene="3" aria-label="Walima details">
        <div class="stage">
          <video class="vid" muted playsinline webkit-playsinline loop preload="metadata" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1"
                 poster="assets/web/v5-plate.jpg" data-src="assets/web/v5-plate.mp4"></video>
          <img class="tl" src="assets/web/text/tx5-1.webp" alt="" aria-hidden="true" style="left:20.648%;top:14.219%;width:73.519%" draggable="false" />
          <img class="tl" src="assets/web/text/tx5-2.webp" alt="" aria-hidden="true" style="left:22.963%;top:23.125%;width:64.259%" draggable="false" />
          <img class="tl" src="assets/web/text/tx5-3.webp" alt="" aria-hidden="true" style="left:45.37%;top:31.458%;width:32.407%" draggable="false" />

          <img class="tl" src="assets/web/text/tx5-7.webp" alt="" aria-hidden="true" style="left:20.648%;top:42.708%;width:71.852%" draggable="false" />
          <img class="tl" src="assets/web/text/tx5-8.webp" alt="" aria-hidden="true" style="left:21.574%;top:45.729%;width:59.444%" draggable="false" />
          <img class="tl" src="assets/web/text/tx5-9.webp" alt="" aria-hidden="true" style="left:21.759%;top:48.073%;width:52.963%" draggable="false" />
          <a class="map-btn" data-map="walima" target="_blank" rel="noopener">
            <span class="map-ico" aria-hidden="true">📍</span> Tap for Location
          </a>
        </div>
      </section>

      <!-- v6 · Blessings / ending -->
      <section class="scene" data-scene="4" aria-label="Blessings">
        <div class="stage">
          <video class="vid" muted playsinline webkit-playsinline loop preload="metadata" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1"
                 poster="assets/web/v6-plate.jpg" data-src="assets/web/v6-plate.mp4"></video>
          <img class="tl" src="assets/web/text/tx6-1.webp" alt="" aria-hidden="true" style="left:7.593%;top:13.75%;width:87.87%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-2.webp" alt="" aria-hidden="true" style="left:12.593%;top:17.292%;width:82.685%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-3.webp" alt="" aria-hidden="true" style="left:37.778%;top:27.865%;width:24.074%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-4.webp" alt="" aria-hidden="true" style="left:11.019%;top:30.625%;width:77.13%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-5.webp" alt="" aria-hidden="true" style="left:24.537%;top:34.531%;width:49.444%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-6.webp" alt="" aria-hidden="true" style="left:4.63%;top:37.292%;width:90.278%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-7.webp" alt="" aria-hidden="true" style="left:6.111%;top:41.354%;width:89.074%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-8.webp" alt="" aria-hidden="true" style="left:21.389%;top:49.427%;width:74.074%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-9.webp" alt="" aria-hidden="true" style="left:33.148%;top:54.896%;width:33.333%" draggable="false" />
          <img class="tl" src="assets/web/text/tx6-10.webp" alt="" aria-hidden="true" style="left:33.519%;top:57.812%;width:51.296%" draggable="false" />
          <div class="ending">
            <button class="replay" type="button">Replay <span aria-hidden="true">↺</span></button>

        </div>
      </section>

      <!-- floral garlands over the page joins -->
      <img class="garland" style="--k:1" src="assets/web/garland-1.webp" alt="" aria-hidden="true" decoding="async" />
      <img class="garland" style="--k:2" src="assets/web/garland-2.webp" alt="" aria-hidden="true" decoding="async" />
      <img class="garland" style="--k:3" src="assets/web/garland-1.webp" alt="" aria-hidden="true" decoding="async" />
      <img class="garland garland--flip" style="--k:4" src="assets/web/garland-2.webp" alt="" aria-hidden="true" decoding="async" />
    </div>
  </main>

  <!-- UI chrome -->
  <div id="progress" aria-hidden="true"><span></span></div>
  <button id="music" type="button" aria-label="Pause music" aria-pressed="true">
    <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="17.5" cy="16" r="2.5" /></svg>
    <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="17.5" cy="16" r="2.5" /><path d="M3 3l18 18" /></svg>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
